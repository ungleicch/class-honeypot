# Class-honeypot Cowrie overrides
# Bind-mounted at /cowrie/cowrie-git/etc/cowrie.cfg (merged over image defaults).
# Telemetry goals: src IP/port/time, SSH client banner, creds, commands,
# downloaded files (stored only), session duration/success.

[honeypot]
hostname = lab-srv01
sensor = class-honeypot
contents_path = var/lib/cowrie
log_path = var/log/cowrie
download_path = ${honeypot:contents_path}/downloads
download_limit_size = 10485760
ttylog = true

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.11

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

[output_textlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.log
