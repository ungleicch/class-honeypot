# Class-honeypot Conpot config overlay (bind-mounted read-only).
# Compatible with dtagdevsec/conpot (T-Pot) which expands %(CONPOT_JSON_LOG)s
# from the container environment. JSON logging is ON for class analysis.

[common]
sensorid = class-honeypot-conpot

[virtual_file_system]
data_fs_url = %(CONPOT_TMP)s
fs_url = tar:///usr/lib/python3.12/site-packages/conpot/data.tar

[session]
timeout = 30

[daemon]
user = conpot
group = conpot

[json]
enabled = True
filename = %(CONPOT_JSON_LOG)s

[sqlite]
enabled = False

[mysql]
enabled = False

[syslog]
enabled = False
device = /dev/log
host = localhost
port = 514
facility = local0
socket = dev

[hpfriends]
enabled = False

[taxii]
enabled = False

# Disabled for class: avoid outbound “what is my IP” calls from the honeypot.
[fetch_public_ip]
enabled = False
urls = ["http://whatismyip.akamai.com/", "http://wgetip.com/"]

[change_mac_addr]
enabled = False
iface = eth0
addr = 00:de:ad:be:ef:00
